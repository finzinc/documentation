<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinZinc API Docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0d12;
      --surface: #111520;
      --border: #1e2535;
      --accent: #00e5a0;
      --accent2: #0066ff;
      --text: #c8d6e8;
      --muted: #4a5568;
      --header-h: 64px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      height: 100%;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 16px;
      z-index: 1000;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--accent);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      flex-shrink: 0;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .logo-text span {
      color: var(--accent);
    }

    .header-badge {
      margin-left: 8px;
      background: var(--border);
      border: 1px solid var(--muted);
      color: var(--muted);
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.1em;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .env-pill {
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 2px;
      border: 1px solid;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      background: transparent;
      transition: all 0.15s;
    }

    .env-pill.prod {
      border-color: var(--accent);
      color: var(--accent);
    }

    .env-pill.test {
      border-color: var(--muted);
      color: var(--muted);
    }

    .env-pill:hover {
      background: rgba(255,255,255,0.04);
    }

    /* ── LAYOUT ── */
    #app {
      padding-top: var(--header-h);
      min-height: 100vh;
    }

    /* ── REDOC OVERRIDES ── */
    redoc-tag-name,
    .redoc-wrap {
      background: var(--bg) !important;
    }

    /* Redoc uses a shadow DOM-ish structure — we override via attribute selectors + class injection */
  </style>
</head>
<body>

<header>
  <div class="logo-mark"></div>
  <span class="logo-text">Fin<span>Zinc</span></span>
  <span class="header-badge">API v1.0.0</span>
  <div class="header-right">
    <button class="env-pill prod" onclick="setEnv('prod')">● Production</button>
    <button class="env-pill test" onclick="setEnv('test')">○ Staging</button>
  </div>
</header>

<div id="app">
  <redoc spec-url="finzinc_updated.json"
         id="redoc-container"
         suppress-warnings="true">
  </redoc>
</div>

<script src="https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js"></script>

<script>
  // Custom Redoc theme matching our dark palette
  const theme = {
    spacing: {
      unit: 5,
      sectionHorizontal: 40,
      sectionVertical: 40,
    },
    breakpoints: {
      small: '50rem',
      medium: '85rem',
      large: '105rem',
    },
    colors: {
      tonalOffset: 0.3,
      primary: { main: '#00e5a0' },
      success: { main: '#00e5a0' },
      warning: { main: '#f6ad55' },
      error: { main: '#fc8181' },
      text: {
        primary: '#c8d6e8',
        secondary: '#718096',
      },
      border: {
        dark: '#1e2535',
        light: '#1e2535',
      },
      responses: {
        success: { color: '#00e5a0', backgroundColor: 'rgba(0,229,160,0.07)', tabTextColor: '#00e5a0' },
        error:   { color: '#fc8181', backgroundColor: 'rgba(252,129,129,0.07)', tabTextColor: '#fc8181' },
        redirect:{ color: '#f6ad55', backgroundColor: 'rgba(246,173,85,0.07)', tabTextColor: '#f6ad55' },
        info:    { color: '#63b3ed', backgroundColor: 'rgba(99,179,237,0.07)', tabTextColor: '#63b3ed' },
      },
      http: {
        get:    { color: '#63b3ed' },
        post:   { color: '#00e5a0' },
        put:    { color: '#f6ad55' },
        delete: { color: '#fc8181' },
        patch:  { color: '#b794f4' },
      },
    },
    schema: {
      linesColor: '#1e2535',
      defaultDetailsWidth: '75%',
      typeNameColor: '#00e5a0',
      typeTitleColor: '#c8d6e8',
      requireLabelColor: '#fc8181',
      labelsTextSize: '0.85em',
      nestingSpacing: '1em',
      nestedBackground: '#111520',
      arrow: { size: '1em', color: '#4a5568' },
    },
    typography: {
      fontSize: '14px',
      lineHeight: '1.6',
      fontWeightRegular: '400',
      fontWeightBold: '600',
      fontWeightLight: '300',
      fontFamily: '"IBM Plex Mono", monospace',
      smoothing: 'antialiased',
      optimizeSpeed: true,
      headings: {
        fontFamily: '"Syne", sans-serif',
        fontWeight: '700',
        lineHeight: '1.3',
      },
      code: {
        fontSize: '13px',
        fontFamily: '"IBM Plex Mono", monospace',
        lineHeight: '1.6',
        fontWeight: '400',
        color: '#00e5a0',
        backgroundColor: '#0a0d12',
        wrap: true,
      },
      links: {
        color: '#00e5a0',
        visited: '#00b87d',
        hover: '#33ffb8',
      },
    },
    menu: {
      width: '260px',
      backgroundColor: '#0a0d12',
      textColor: '#718096',
      groupItems: {
        textTransform: 'uppercase',
      },
      level1Items: {
        textTransform: 'none',
      },
      arrow: { size: '1.5em', color: '#4a5568' },
    },
    logo: {
      gutter: '20px',
    },
    rightPanel: {
      backgroundColor: '#080b10',
      width: '40%',
      textColor: '#c8d6e8',
    },
    fab: {
      backgroundColor: '#00e5a0',
      color: '#0a0d12',
    },
  };

  Redoc.init(
    'finzinc_updated.json',
    {
      theme,
      hideDownloadButton: false,
      disableSearch: false,
      expandResponses: '200',
      nativeScrollbars: false,
      pathInMiddlePanel: false,
      hideHostname: false,
      scrollYOffset: 64,
    },
    document.getElementById('redoc-container')
  );

  // Env switcher — rewrites the spec's server URL description in the sidebar
  function setEnv(env) {
    const pills = document.querySelectorAll('.env-pill');
    pills.forEach(p => {
      p.style.opacity = p.classList.contains(env) ? '1' : '0.4';
    });
    // Visual feedback only; full server switching would require re-init with modified spec
    const label = env === 'prod' ? '● Production' : '○ Staging';
    console.log('[FinZinc] Active env:', env === 'prod' ? 'https://api.finzinc.net' : 'https://api-test.finzinc.net');
  }
</script>

</body>
</html>
